<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Btiq Digital — Performance Engine (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#1a1c18; min-height:100%; }
  body {
    font-family: 'Geist', system-ui, sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh;
  }
  /* Mobile: full-bleed phone */
  .phone-frame {
    width: 100%;
    max-width: 100vw;
    background: #0d0e0c;
    min-height: 100vh;
  }
  /* Desktop: show as a phone in a dark dev surface */
  @media (min-width: 768px) {
    body { padding: 40px 0; align-items: flex-start; }
    .phone-frame {
      width: 390px;
      max-width: 390px;
      min-height: 844px;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 9px #000, 0 0 0 10px rgba(255,255,255,0.06);
      margin: 20px;
    }
  }
  /* hide native scrollbar inside phone view on desktop only */
  @media (min-width:768px) {
    .phone-frame::-webkit-scrollbar { display:none; }
    .phone-frame { scrollbar-width: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" class="phone-frame"></div>
<script type="text/babel" src="direction-b.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.DirectionB/>);
</script>
</body>
</html>
